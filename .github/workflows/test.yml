name: test

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -S warning install.sh uninstall.sh bin/* tests/*.sh

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Installa
        run: ./install.sh
      - name: Test end-to-end
        run: ./tests/e2e.sh
      - name: Reinstallazione (idempotente)
        run: ./install.sh && ./install.sh --ricrea && ./tests/e2e.sh
      - name: Disinstalla
        run: ./uninstall.sh && ! docker ps -a | grep -q scuola
